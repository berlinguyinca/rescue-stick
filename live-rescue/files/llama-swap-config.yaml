# llama-swap config for fiehnlab-live's ON-DEMAND model tier - decoupled
# from the two fixed always-on units (llama-chat.service :8080,
# llama-embed.service :8081). Models are added here at runtime by
# fiehnlab-models (or by hand) after an `hf download`; llama-swap
# watches this file (-watch-config, the CLI default) and reloads
# automatically on save, so nothing needs to be restarted by hand.
#
# Every model's cmd goes through /usr/local/bin/fiehnlab-llama so it gets
# the same GPU-detect logic (cuda/vulkan/cpu) as the two fixed services.
healthCheckTimeout: 300
logLevel: info
startPort: 10001
models: {}
